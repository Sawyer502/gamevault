<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameVault Proxy</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07080c;
            --panel: #11131a;
            --accent: #b9ff3d;
            --text: #f5f7fa;
            --muted: #8d93a1;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; }
        body { padding: 14px; }
        .bar { display: flex; gap: 8px; margin-bottom: 12px; }
        input {
            flex: 1;
            min-width: 0;
            border: 1px solid #252936;
            border-radius: 10px;
            background: var(--panel);
            color: var(--text);
            padding: 12px 14px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            border: 0;
            border-radius: 10px;
            padding: 0 18px;
            background: var(--accent);
            color: #080a0d;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: wait; }
        #error { color: #ff7272; margin: 8px 2px; min-height: 20px; font-size: 13px; }
        #frame {
            display: none;
            width: 100%;
            height: calc(100vh - 95px);
            min-height: 500px;
            border: 1px solid #252936;
            border-radius: 12px;
            background: #fff;
        }
        .hint { color: var(--muted); font-size: 12px; margin: 0 2px 8px; }
    </style>
</head>
<body>
    <form id="proxy-form" class="bar">
        <input id="address" autocomplete="off" placeholder="Enter a website or search" spellcheck="false">
        <button id="go" type="submit">Go</button>
    </form>
    <p class="hint">GameVault Proxy</p>
    <div id="error"></div>
    <iframe id="frame" title="GameVault Proxy" allow="fullscreen"></iframe>

    <script src="/proxy/baremux/index.js"></script>
    <script src="/proxy/uv/uv.bundle.js"></script>
    <script src="/proxy/uv/uv.config.js"></script>
    <script src="/proxy/register-sw.js"></script>
    <script src="/proxy/index.js"></script>
</body>
</html>
